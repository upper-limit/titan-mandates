name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest ruff pyyaml
          pip install -e .
      - name: Lint with ruff
        run: |
          ruff check .
          ruff format --check .
      - name: Run tests
        run: pytest -v
      - name: Verify mandate YAML schemas
        run: python -m examples.verify_mandate_schemas

  audit-chain-integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: pip install -e .
      - name: Audit chain smoke test
        run: python -m examples.audit_chain_smoke
