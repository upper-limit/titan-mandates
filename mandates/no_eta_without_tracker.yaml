id: M32
name: No ETA without mechanical commitment tracker
version: 1.0
status: active
authors:
  - github: cruxapex-team
domain: governance
applies_to:
  - agent_outbound_with_time_commitment
rule: |
  Agents may not use commitment language ("ETA", "will report",
  "will confirm", "checking back", "will get back to you", "soon",
  "in N minutes", "by tomorrow") in ANY message without
  simultaneously recording the commitment via a tracker (database
  row, ticket, calendar event — something mechanical). Words alone
  are not commitments. A commitment exists only when it has a
  durable record that can be auto-checked on expiry.
verification: |
  For each outbound message containing commitment language, check
  the commitment tracker (commitments database) within 60 seconds
  for a matching row. If no row exists, the mandate is violated.
  An enforcer daemon can poll the tracker every minute for expired
  open commitments and inject prompts to the owning agent.
violation_action: alert_owner_and_log
references:
  - feedback_no_eta_without_tool_call.md
example_compliant: |
  Agent says "I'll have the deploy done by 17:00 PT."
  Same agent immediately records commitment: deadline=17:00 PT,
  text="deploy done", owner=agent-A. Tracker auto-checks at 17:00.
example_violation: |
  Agent says "I'll get back to you in 10 minutes." No tracker row.
  10 minutes pass. Agent doesn't get back. Operator has no
  enforcement mechanism. Trust erodes.
